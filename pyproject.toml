[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eazydatafix"
dynamic = ["version"]
description = "Deterministic data transformation, quality, cleaning, and readiness workflows."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Suneel Kumar Kola" }
]

license = "MIT"
license-files = ["LICENSE"]

keywords = [
    "data-quality",
    "data-cleaning",
    "data-transformation",
    "data-validation",
    "data-profiling",
    "pandas",
    "etl",
    "data-analysis",
    "business-intelligence",
    "machine-learning",
    "exploratory-data-analysis",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14.0.0"]
openai = ["openai>=1.66.3,<3"]
yaml = ["PyYAML>=6.0"]

[project.scripts]
edf = "eazydatafix.cli:main"

[project.urls]
Homepage = "https://eazydatafix.com"
Repository = "https://github.com/suneelprojects/eazydatafix"
Documentation = "https://eazydatafix.com/docs"
Issues = "https://github.com/suneelprojects/eazydatafix/issues"
Changelog = "https://github.com/suneelprojects/eazydatafix/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["eazydatafix*"]

[tool.setuptools.dynamic]
version = { attr = "eazydatafix._version.__version__" }

[tool.setuptools.package-data]
eazydatafix = [
    "reporting/templates/*.html",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
