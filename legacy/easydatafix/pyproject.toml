[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "easydatafix"
version = "0.3.0"
description = "Deprecated alias for eazydatafix. Install eazydatafix instead."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Suneel Kumar Kola" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["eazydatafix", "deprecated", "data-cleaning"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "eazydatafix>=2.0.0,<3",
]

[project.urls]
Homepage = "https://eazydatafix.com"
Repository = "https://github.com/suneelprojects/eazydatafix"
Changelog = "https://github.com/suneelprojects/eazydatafix/blob/main/legacy/easydatafix/README.md"
Successor = "https://pypi.org/project/eazydatafix/"

[tool.setuptools.packages.find]
include = ["easydatafix*"]
